name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Package binary
        run: |
          tar -C target/release -czf "lastwave-${{ matrix.target }}.tar.gz" lastwave
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: "lastwave-${{ matrix.target }}.tar.gz"